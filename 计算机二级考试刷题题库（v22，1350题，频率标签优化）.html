const STORAGE_KEY = 'cquiz_v15';

let state = {
  currentPage: 'home',
  pageHistory: [],
  quizMode: 'sequential',
  quizList: [],
  quizIndex: 0,
  currentPaper: null,
  currentBig: null,
  currentKnowledge: null,
  bookType: 'wrong',
  homeCat: 'all',
  homeMode: 'all',
  specialCat: 'all',
  bigFilterCat: 'all',
  knowledgeCat: 'all',
  records: {},
  favorites: [],
  wrongs: []
};

function loadState() {
  try {
    const saved = localStorage.getItem(STORAGE_KEY);
    if (saved) {
      const data = JSON.parse(saved);
      state.records = data.records || {};
      state.favorites = data.favorites || [];
      state.wrongs = data.wrongs || [];
    }
  } catch(e) {}
}

function saveState() {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify({
      records: state.records,
      favorites: state.favorites,
      wrongs: state.wrongs
    }));
  } catch(e) {}
}

function getFilteredQuestions() {
  let list = QUESTIONS.slice();
  if (state.homeCat !== 'all') list = list.filter(q => q.cat === state.homeCat);
  if (state.homeMode === 'star') list = list.filter(q => q.is_star);
  return list;
}

function getStats(list) {
  const total = list.length;
  let done = 0, correct = 0, wrong = 0;
  list.forEach(q => {
    if (state.records[q.id]) {
      done++;
      if (state.records[q.id].correct) correct++;
      else wrong++;
    }
  });
  const rate = done > 0 ? Math.round(correct/done*100) : 0;
  return {total, done, correct, wrong, rate};
}

function switchPage(page, pushHistory=true) {
  if (pushHistory && state.currentPage !== page) {
    state.pageHistory.push(state.currentPage);
  }
  state.currentPage = page;
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  const pageEl = document.getElementById('page-' + page);
  if (pageEl) pageEl.classList.add('active');
  
  document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
  const navMap = {home:0, knowledge:1, mine:2};
  if (navMap[page] !== undefined) {
    document.querySelectorAll('.nav-item')[navMap[page]].classList.add('active');
  }
  
  const backPages = ['quiz','paperDetail','bigDetail','knowledgeDetail','book','papers','big','special'];
  document.getElementById('backBtn').style.display = backPages.includes(page) ? 'block' : 'none';
  
  const titles = {
    home:'计算机二级考试刷题题库', knowledge:'知识库', mine:'我的',
    quiz:'刷题练习', papers:'套题真题', paperDetail:'套题详情',
    big:'大题真题', bigDetail:'大题详情', knowledgeDetail:'知识点',
    book:'我的题库', special:'专项刷题'
  };
  document.getElementById('headerTitle').textContent = titles[page] || '计算机二级考试刷题题库';
  
  if (page === 'home') renderHome();
  if (page === 'knowledge') renderKnowledge();
  if (page === 'mine') renderMine();
  if (page === 'papers') renderPapers();
  if (page === 'big') renderBig();
  if (page === 'book') renderBook();
  if (page === 'special') renderSpecial();
  
  window.scrollTo(0,0);
}

function goBack() {
  if (state.pageHistory.length > 0) {
    const prev = state.pageHistory.pop();
    switchPage(prev, false);
  } else {
    switchPage('home', false);
  }
}

function setHomeCat(cat, btn) {
  state.homeCat = cat;
  document.querySelectorAll('#homeCatFilter .filter-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  renderHome();
}

function setHomeMode(mode, btn) {
  state.homeMode = mode;
  document.querySelectorAll('.mode-switch .ms-btn').forEach(b => b.classList.remove('active'));
  renderHome();
}

function setSpecialCat(cat, btn) {
  state.specialCat = cat;
  document.querySelectorAll('#specialCatFilter .filter-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  renderSpecial();
}

    return `<div class="special-item" style="border-left-color:${colors[i%colors.length]}" onclick="startSpecial('${t}')">
      <div class="s-name">${tagNames[t]||t}</div>
      <div class="s-count">共${count}题，已做${done}题</div>
    </div>`;
  }).join('');

}

function startSpecial(tag) {
  let list = QUESTIONS.filter(q => (q.tags||[]).includes(tag));
  if (state.specialCat !== 'all') list = list.filter(q => q.cat === state.specialCat);
  if (list.length === 0) { alert('该专项暂无题目'); return; }
  state.quizMode = 'special';
  state.quizList = list;
  state.quizIndex = 0;
  switchPage('quiz');
  renderQuestion();
}

function startQuiz(mode, paperName=null) {
  state.quizMode = mode;
  state.currentPaper = paperName;
  
  if (paperName) {
    const paper = PAPERS.find(p => p.name === paperName);
    state.quizList = paper ? paper.questions.slice() : [];
  } else if (mode === 'sequential') {
    state.quizList = getFilteredQuestions();
  } else if (mode === 'random') {
    state.quizList = getFilteredQuestions().sort(() => Math.random() - 0.5);
  } else if (mode === 'wrong') {
    state.quizList = QUESTIONS.filter(q => state.wrongs.includes(q.id));
  }
  
  if (state.quizList.length === 0) {
    alert(mode === 'wrong' ? '暂无错题，继续加油！' : '暂无题目');
    return;
  }
  
  state.quizIndex = 0;
  switchPage('quiz');
  renderQuestion();
}

function renderQuestion() {
  const q = state.quizList[state.quizIndex];
  if (!q) return;
  
  // 刷题页统计
  const stats = getStats(state.quizList);
  document.getElementById('qTotal').textContent = stats.total;
  document.getElementById('qDone').textContent = stats.done;
  document.getElementById('qCorrect').textContent = stats.correct;
  document.getElementById('qRate').textContent = stats.rate + '%';
  document.getElementById('qWrong').textContent = stats.wrong;
  
  document.getElementById('quizNum').textContent = `第${state.quizIndex+1}题`;
  document.getElementById('quizProgress').textContent = `/${state.quizList.length}`;
  
  const tags = [];
  const catMap = {c:'C语言',public:'公共基础',ms:'MS',wps:'WPS'};
  tags.push(`<span class="tag tag-${q.cat}">${catMap[q.cat]}</span>`);
  if (q.is_star) tags.push('<span class="tag tag-star">⭐精选</span>');
  if (q.frequency) {
    const ac = q.appear_count || 1;
    if (ac >= 2) {
    tags.push(`<span class="tag" style="background:#f3e5f5;color:#7b1fa2">${q.frequency}(出现${ac}次)</span>`);
    } else {
      tags.push(`<span class="tag" style="background:#f3e5f5;color:#7b1fa2">${q.frequency}</span>`);
    }
  }
  if (q.paper) {
    const papers = q.paper.split('、').filter(p => p.trim());
    papers.forEach(p => tags.push(`<span class="tag" style="background:#e0f7fa;color:#00838f">${p}</span>`));
  }
  document.getElementById('quizTags').innerHTML = tags.join('');
  
  document.getElementById('questionText').textContent = q.q;
  
  const codeEl = document.getElementById('codeBlock');
  if (q.code) {
    codeEl.textContent = q.code;
    codeEl.style.display = 'block';
  } else {
    codeEl.style.display = 'none';
  }
  
  // 收藏/错题按钮状态
  const isFav = state.favorites.includes(q.id);
  const favBtn = document.getElementById('favBtn');
  favBtn.textContent = isFav ? '★ 已收藏' : '☆ 收藏';
  favBtn.classList.toggle('active', isFav);
  
  const isWrong = state.wrongs.includes(q.id);
  const wrongBtn = document.getElementById('wrongBtn');
  wrongBtn.textContent = isWrong ? '✓ 已标错题' : '✕ 标错题';
  wrongBtn.classList.toggle('active', isWrong);
  
  const record = state.records[q.id];
  const optsHtml = q.opts.map((opt, i) => {
    const letter = String.fromCharCode(65+i);
    let cls = 'option';
    if (record) {
      cls += ' disabled';
      if (letter === q.ans) cls += ' correct';
      else if (record.selected === letter) cls += ' wrong';
    }
    return `<div class="${cls}" onclick="selectOption(${i})">
      <div class="opt-letter">${letter}</div>
      <div class="opt-text">${opt}</div>
    </div>`;
  }).join('');
  document.getElementById('optionsList').innerHTML = optsHtml;
  
  // 反馈和解析
  const feedbackArea = document.getElementById('feedbackArea');
  const ansSection = document.getElementById('answerSection');
  if (record) {
    if (record.correct) {
      feedbackArea.innerHTML = '<div class="answer-feedback correct">✅ 回答正确！</div>';
    } else {
      feedbackArea.innerHTML = `<div class="answer-feedback wrong">❌ 回答错误，正确答案是 ${q.ans}</div>`;
    }
    ansSection.style.display = 'block';
    document.getElementById('correctAns').textContent = q.ans + '. ' + q.opts[q.ans.charCodeAt(0)-65];
    const yourRow = document.getElementById('yourAnsRow');
    if (record.selected !== q.ans) {
      yourRow.style.display = 'block';
      document.getElementById('yourAns').textContent = record.selected + '. ' + q.opts[record.selected.charCodeAt(0)-65];
    } else {
      yourRow.style.display = 'none';
    }
    document.getElementById('expText').textContent = q.exp || '暂无解析';
    
    const weHtml = (q.wrong_exps || []).map((w,i) => 
      `<div class="wrong-exp-item">${String.fromCharCode(65+i)}. ${w}</div>`
    ).join('');
    document.getElementById('wrongExps').innerHTML = weHtml;
    
    document.getElementById('detailExp').innerHTML = `
      <p><strong>题目分析：</strong>${q.exp || '暂无解析'}</p>
      ${q.frequency ? `<p><strong>出现频率：</strong>${q.frequency}${(q.appear_count||1)>=2 ? "(出现"+(q.appear_count||1)+"次)" : ""}</p>` : ''}
      ${q.exam_year ? `<p><strong>真题年份：</strong>${q.exam_year}年${q.exam_session||''}</p>` : ''}
      ${q.tags && q.tags.length ? `<p><strong>相关知识点：</strong>${q.tags.join('、')}</p>` : ''}
    `;
  } else {
    feedbackArea.innerHTML = '';
    ansSection.style.display = 'none';
  }
  
  document.getElementById('prevBtn').disabled = state.quizIndex === 0;
  document.getElementById('nextBtn').textContent = state.quizIndex === state.quizList.length-1 ? '完成' : '下一题';
}

function selectOption(idx) {
  const q = state.quizList[state.quizIndex];
  if (state.records[q.id]) return;
  
  const letter = String.fromCharCode(65+idx);
  const correct = letter === q.ans;
  
  state.records[q.id] = {selected: letter, correct, time: Date.now()};
  
  if (correct) {
    state.wrongs = state.wrongs.filter(id => id !== q.id);
  } else {
    if (!state.wrongs.includes(q.id)) state.wrongs.push(q.id);
  }
  
  saveState();
  renderQuestion();
}

function prevQuestion() {
  if (state.quizIndex > 0) {
    state.quizIndex--;
    renderQuestion();
  }
}

function nextQuestion() {
  if (state.quizIndex < state.quizList.length - 1) {
    state.quizIndex++;
    renderQuestion();
  } else {
    alert('已完成本组题目！');
    goBack();
  }
}

function toggleFav() {
  const q = state.quizList[state.quizIndex];
  if (state.favorites.includes(q.id)) {
    state.favorites = state.favorites.filter(id => id !== q.id);

    state.favorites.push(q.id);
  }

function toggleWrong() {
  const q = state.quizList[state.quizIndex];

function renderMarkdown(text) {
  if (!text) return '';
  let html = text;
  // 转义HTML特殊字符
  html = html.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  // 代码块 ```...```
  html = html.replace(/```([\s\S]*?)```/g, function(match, code) {
    return '<pre><code>' + code.trim() + '</code></pre>';
  });
  // 行内代码 `...`
  html = html.replace(/`([^`]+)`/g, '<code>$1</code>');
  // 标题 ## ...
  html = html.replace(/^## (.+)$/gm, '<h2>$1</h2>');
  html = html.replace(/^### (.+)$/gm, '<h3>$1</h3>');
  // 粗体 **...**
  html = html.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
  // 表格
  const tableRegex = /^\|(.+)\|\n\|([-:| ]+)\|\n((?:\|.+\|\n?)+)$/gm;
  html = html.replace(tableRegex, function(match, header, sep, rows) {
    const headers = header.split('|').map(h => h.trim()).filter(h => h);
    const rowLines = rows.trim().split('\n').filter(r => r.trim());
    let tableHtml = '<table><thead><tr>';
    headers.forEach(h => { tableHtml += '<th>' + h + '</th>'; });
    tableHtml += '</tr></thead><tbody>';
    rowLines.forEach(row => {
      const cells = row.split('|').map(c => c.trim()).filter((c,i) => i < headers.length);
      tableHtml += '<tr>';
      cells.forEach(c => { tableHtml += '<td>' + c + '</td>'; });
      tableHtml += '</tr>';
    });
    tableHtml += '</tbody></table>';
    return tableHtml;
  });
  // 无序列表 - ...
  html = html.replace(/^- (.+)$/gm, '<li>$1</li>');
  html = html.replace(/(<li>.*<\/li>\n?)+/g, function(match) {
    return '<ul>' + match + '</ul>';
  });
  // 有序列表 1. ...
  html = html.replace(/^\d+\. (.+)$/gm, '<li>$1</li>');
  html = html.replace(/(<li>.*<\/li>\n?)+/g, function(match) {
    if (match.indexOf('<ul>') === -1) return '<ol>' + match + '</ol>';
    return match;
  });
  // 引用 > ...
  html = html.replace(/^> (.+)$/gm, '<blockquote>$1</blockquote>');
  // 水平线 ---
  html = html.replace(/^---$/gm, '<hr>');
  // 段落（空行分隔）
  html = html.replace(/\n\n/g, '</p><p>');
  html = '<p>' + html + '</p>';
  // 清理空段落
  html = html.replace(/<p><\/p>/g, '');
  html = html.replace(/<p>\s*<\/p>/g, '');
  return html;
}

  if (list.length === 0) {
    document.getElementById('bookList').innerHTML = `<div class="empty-state">
      <div class="e-icon">${state.bookType==='wrong'?'📕':'⭐'}</div>
      <div class="e-text">${state.bookType==='wrong'?'暂无错题，继续加油！':'暂无收藏题目'}</div>
    </div>`;
    return;
  }
  
  const html = list.map(q => {
    const rec = state.records[q.id];
    return `<div class="big-item" onclick="reviewQuestion(${q.id})">
      <div class="big-title" style="font-size:13px">${q.q.length>50?q.q.substring(0,50)+'...':q.q}</div>
      <div class="big-meta">
        <span class="tag tag-${q.cat}">${catMap[q.cat]}</span>
        <span style="color:#2e7d32;font-weight:600">正确答案：${q.ans}</span>
        ${rec && !rec.correct ? `<span style="color:#c62828;font-weight:600">你的答案：${rec.selected}</span>` : ''}
      </div>
    </div>`;
  }).join('');
  document.getElementById('bookList').innerHTML = html;
}

function reviewQuestion(id) {
  const q = QUESTIONS.find(x => x.id === id);
  if (!q) return;
  state.quizMode = 'review';
  state.quizList = [q];
  state.quizIndex = 0;
  switchPage('quiz');
  renderQuestion();
}

function confirmClear() { document.getElementById('confirmModal').classList.add('show'); }
function hideConfirm() { document.getElementById('confirmModal').classList.remove('show'); }

function clearAll() {
  state.records = {};
  state.favorites = [];
  state.wrongs = [];
  saveState();
  hideConfirm();
  renderMine();
  alert('已清除所有记录');
}

loadState();
renderHome();
</script>
</body>
</html>
