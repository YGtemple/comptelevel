：0，输出结果是（ ）。", "opts": ["0,1,2,3,4,", "0,0,0,0,0,", "5", "0,1,"], "ans": "A", "exp": "输入的是字符'0'，ASCII码是48。i=0~4都小于48，条件i>c不成立，所以全部输出0,1,2,3,4。", "is_star": true, "frequency": "高频", "tags": ["c_control", "c_io"], "appear_count": 1}, {"id": 566, "cat": "c", "q": "程序如下：char ch='D'; while(ch>'A'){ch--; putchar(ch); if(ch=='A') break; putchar(ch+1);} 程序运行输出结果是（ ）。", "opts": ["CDBCA", "BCA", "CCBB", "CB"], "ans": "A", "exp": "ch='D'→ch--='C'→输出C→不是A→输出D。ch--='B'→输出B→输出C。ch--='A'→输出A→break。合计CDBCA。", "is_star": true, "frequency": "高频", "tags": ["c_control", "c_io"], "appear_count": 1}, {"id": 567, "cat": "c", "q": "程序如下：int s[12]={1,2,3,4,4,3,2,1,1,1,2,3},c[5]={0},i; for(i=0;i<12;i++) c[s[i]]++; for(i=1;i<5;i++) printf(\"%d\",c[i]); 程序运行结果是（ ）。", "opts": ["1 2 3 4", "2 3 4 4", "4 3 3 2", "1 1 2 3"], "ans": "C", "exp": "统计数字1~4出现的次数：1出现4次，2出现3次，3出现3次，4出现2次。输出4332。", "is_star": false, "frequency": "中频", "tags": ["c_control", "c_io"], "appear_count": 1}, {"id": 568, "cat": "c", "q": "程序如下：int x=23; do{printf(\"%2d\\n\",x--);}while(!x); 程序执行结果是（ ）。", "opts": ["输出23", "输出321", "不输出任何内容", "陷入死循环"], "ans": "A", "exp": "x=23，先输出23，再执行x--→x=22。!x=!22=0（假），退出循环。只输出23。", "is_star": true, "frequency": "高频", "tags": ["c_control", "c_io"], "appear_count": 1}, {"id": 569, "cat": "c", "q": "在嵌套使用if语句时，C语言规定else总是（ ）。", "opts": ["和之前与其具有相同缩进位置的if配对", "和之前与其最近的if配对", "和之前与其最近的且不带else的if配对", "和之前的第一个if配对"], "ans": "C", "exp": "C语言规则：else总是与最近且尚未配对的if匹配，与缩进位置无关。", "is_star": true, "frequency": "高频", "tags": ["c_control"], "appear_count": 1}, {"id": 570, "cat": "c", "q": "程序如下：char b,c; int i; b='a'; c='A'; for(i=0;i<6;i++){if(i%2) putchar(i+b); else putchar(i+c);} 程序运行后输出结果是（ ）。", "opts": ["ABCDEF", "AbCdEf", "aBcDeF", "abcdef"], "ans": "B", "exp": "i=0偶数→输出'A'+0=A。i=1奇数→输出'a'+1=b。i=2偶数→输出'A'+2=C。i=3奇数→输出'a'+3=d。i=4偶数→输出'A'+4=E。i=5奇数→输出'a'+5=f。合计AbCdEf。", "is_star": true, "frequency": "高频", "tags": ["c_control", "c_io"], "appear_count": 1}, {"id": 571, "cat": "c", "q": "以下选项中，合法的C语言实数是（ ）。", "opts": [".2e1", "E09", "3.1ε3.1", "1.23E"], "ans": "A", "exp": "实型常量科学计数法格式：[整数部分.]小数部分E/e[±]指数。A中.2e1等价于0.2×10¹，合法。B缺少整数/小数部分，C用ε错误，D缺少指数。", "is_star": false, "frequency": "中频", "tags": ["c_datatype"], "appear_count": 1}, {"id": 572, "cat": "c", "q": "设有定义语句：double x=123.456; 则语句printf(\"%6.2f, %3.0f\\n\",x,x);的输出结果是（ ）。", "opts": ["123.46,123.0", "123.45, 123", "123.45, 123.", "123.46, 123"], "ans": "D", "exp": "%6.2f表示输出宽度6，保留2位小数，123.456四舍五入为123.46。%3.0f表示保留0位小数，四舍五入为123。", "is_star": true, "frequency": "高频", "tags": ["c_control", "c_io"], "appear_count": 1}, {"id": 573, "cat": "c", "q": "有如下程序：int x=032; printf(\"%d\\n\",x); 程序运行后的输出结果是（ ）。", "opts": ["032", "32", "26", "50"], "ans": "C", "exp": "032是八进制整数（以0开头），转换为十进制：3×8+2=26。", "is_star": true, "frequency": "高频", "tags": ["c_io"], "appear_count": 1}, {"id": 574, "cat": "c", "q": "以下说法错误的是（ ）。", "opts": ["程序模块化的目的之一是提高程序编制的效率", "程序模块化的目的之一是提高程序的执行速度", "程序模块化的目的之一是提高程序代码复用率", "程序模块化的目的之一是提高调试程序的效率"], "ans": "B", "exp": "模块化可提高代码复用率、编制和调试效率，但不会直接提高执行速度（可能因函数调用略有开销）。", "is_star": false, "frequency": "中频", "tags": ["c_function"], "appear_count": 1}, {"id": 575, "cat": "c", "q": "以下选项中不属于字符常量的是（ ）。", "opts": ["'C'", "\"C\"", "'\\xCC'", "'\\072'"], "ans": "B", "exp": "字符常量用单引号括起来，如'C'、'\\xCC'（十六进制转义）、'\\072'（八进制转义）。\"C\"用双引号括起来是字符串常量，不是字符常量。", "is_star": true, "frequency": "高频", "tags": ["c_datatype", "c_string"], "appear_count": 1}, {"id": 576, "cat": "c", "q": "按照C语言规定的用户标识符命名规则，不能出现在标识符中的是（ ）。", "opts": ["大写字母", "下划线", "数字字符", "连接符"], "ans": "D", "exp": "C语言标识符由字母、下划线、数字组成，且开头必须是字母或下划线。连接符（-）不能出现在标识符中。", "is_star": false, "frequency": "中频", "tags": ["c_datatype"], "appear_count": 1}, {"id": 577, "cat": "c", "q": "执行完循环\"for(i=1;i<100;i++);\"后，i的值为（ ）。", "opts": ["99", "100", "101", "102"], "ans": "B", "exp": "循环条件i<100，当i=99时条件成立执行循环体（空语句），然后i++→i=100，此时条件i<100不成立，退出循环。i的值为100。", "is_star": true, "frequency": "高频", "tags": ["c_control"], "appear_count": 1}, {"id": 578, "cat": "public", "q": "计算机内部，一切信息的存取、处理和传送都是以（ ）进行的。", "opts": ["二进制", "ASCII码", "十六进制", "EBCDIC码"], "ans": "A", "exp": "计算机内部采用二进制表示和处理信息，因为二进制具有可行性（电子器件两种状态）、简易性（运算规则简单）、逻辑性（0和1对应真假）、可靠性（不易出错）等特点。", "wrong_exps": {"A": "二进制是计算机内部信息表示和处理的基本形式", "B": "ASCII码是字符编码标准，用于表示字符，不是一切信息的表示形式", "C": "十六进制是二进制的简写形式，用于方便阅读，计算机内部仍用二进制", "D": "EBCDIC码是IBM大型机使用的字符编码，不是通用的内部表示形式"}, "is_star": false, "tags": ["p_program"], "frequency": "中频", "appear_count": 1}, {"id": 579, "cat": "public", "q": "冯·诺依曼型体系结构的计算机包含的五大部件是（ ）。", "opts": ["输入设备、运算器、控制器、存储器、输出设备", "输入/出设备、运算器、控制器、内/外存储器、电源设备", "输入设备、中央处理器、只读存储器、随机存储器、输出设备", "键盘、主机、显示器、磁盘机、打印机"], "ans": "A", "exp": "冯·诺依曼型计算机的五大基本部件是：输入设备、运算器、控制器、存储器、输出设备。其核心思想是存储程序和程序控制。", "wrong_exps": {"A": "这是冯·诺依曼五大部件的标准表述", "B": "电源设备不是五大部件之一，内/外存储器分类不对", "C": "中央处理器包含运算器和控制器，只读/随机存储器是存储器的分类，重复了", "D": "这些是具体设备举例，不是五大部件的抽象表述"}, "is_star": false, "tags": ["p_program"], "frequency": "中频", "appear_count": 1}, {"id": 580, "cat": "public", "q": "第一台计算机是1946年在美国研制的，该机英文缩写名为（ ）。", "opts": ["EDSAC", "EDVAC", "ENIAC", "MARK-II"], "ans": "C", "exp": "1946年美国宾夕法尼亚大学研制的第一台电子数字计算机是ENIAC（Electronic Numerical Integrator And Calculator，电子数字积分计算机）。", "wrong_exps": {"A": "EDSAC是1949年英国剑桥大学研制的，是第一台存储程序计算机", "B": "EDVAC是冯·诺依曼参与设计的存储程序计算机，1952年完成", "C": "ENIAC是1946年第一台电子数字计算机", "D": "MARK-II是哈佛大学研制的继电器计算机，不是第一台电子计算机"}, "is_star": false, "tags": ["p_program"], "frequency": "中频", "appear_count": 1}, {"id": 581, "cat": "public", "q": "调制解调器（Modem）的作用是（ ）。", "opts": ["将计算机的数字信号转换成模拟信号", "将模拟信号转换成计算机的数字信号", "将计算机数字信号与模拟信号互相转换", "为了上网与接电话两不误"], "ans": "C", "exp": "调制解调器的作用是实现数字信号和模拟信号的双向转换。发送时调制（数字→模拟），接收时解调（模拟→数字），使计算机能通过电话线上网。", "wrong_exps": {"A": "只说了调制（数字→模拟），不完整，还有解调过程", "B": "只说了解调（模拟→数字），不完整，还有调制过程", "C": "完整表述了调制和解调两个过程，即数字信号与模拟信号互相转换", "D": "这是使用效果，不是调制解调器的本质作用"}, "is_star": false, "tags": ["p_program"], "frequency": "中频", "appear_count": 1}, {"id": 582, "cat": "public", "q": "1KB的存储空间能存储（ ）个汉字国标（GB2312-80）码。", "opts": ["1024", "512", "256", "128"], "ans": "B", "exp": "一个汉字国标码占2个字节，1KB=1024字节，所以1KB能存储1024/2=512个汉字国标码。", "wrong_exps": {"A": "1024是1KB的字节数，不是汉字数，一个汉字占2字节", "B": "1024字节÷2字节/汉字=512个汉字", "C": "256是1KB能存储的4字节数据项数量", "D": "128是1KB能存储的8字节数据项数量"}, "is_star": false, "tags": ["p_program"], "frequency": "中频", "appear_count": 1}, {"id": 583, "cat": "public", "q": "二进制数01100011转换成的十进制数是（ ）。", "opts": ["51", "98", "99", "100"], "ans": "C", "exp": "二进制转十进制按权展开：01100011 = 0×2⁷+1×2⁶+1×2⁵+0×2⁴+0×2³+0×2²+1×2¹+1×2⁰ = 64+32+2+1 = 99。", "wrong_exps": {"A": "51是二进制00110011的十进制值", "B": "98是二进制01100010的十进制值", "C": "64+32+2+1=99，计算正确", "D": "100是二进制01100100的十进制值"}, "is_star": false, "tags": ["p_program"], "frequency": "中频", "appear_count": 1}, {"id": 584, "cat": "public", "q": "计算机操作系统的主要功能是（ ）。", "opts": ["对计算机的所有资源进行控制和管理，为用户使用计算机提供方便", "对源程序进行翻译", "对用户数据文件进行管理", "对汇编语言程序进行翻译"], "ans": "A", "exp": "操作系统是管理计算机硬件与软件资源的系统软件，主要功能包括进程管理、内存管理、文件管理、设备管理等，为用户使用计算机提供方便的接口。", "wrong_exps": {"A": "完整表述了操作系统管理软硬件资源、为用户提供方便的核心功能", "B": "对源程序进行翻译是编译程序（编译器）的功能，不是操作系统", "C": "对用户数据文件进行管理只是操作系统文件管理功能的一部分，不全面", "D": "对汇编语言程序进行翻译是汇编程序的功能，不是操作系统"}, "is_star": false, "tags": ["p_program"], "frequency": "中频", "appear_count": 1}, {"id": 585, "cat": "public", "q": "Internet实现了分布在世界各地的各类网络的互联，其最基础和核心的协议是（ ）。", "opts": ["HTTP", "FTP", "HTML", "TCP/IP"], "ans": "D", "exp": "TCP/IP（传输控制协议/网际协议）是Internet最基础和核心的协议簇，定义了数据如何在网络中传输和路由。HTTP是应用层协议，FTP是文件传输协议，HTML是标记语言。", "wrong_exps": {"A": "HTTP是超文本传输协议，用于网页传输，是应用层协议，不是最基础核心", "B": "FTP是文件传输协议，用于文件传输，只是众多应用协议之一", "C": "HTML是超文本标记语言，用于编写网页，不是协议", "D": "TCP/IP是Internet的基础协议簇，包含IP、TCP、UDP等核心协议"}, "is_star": false, "tags": ["p_program"], "frequency": "中频", "appear_count": 1}, {"id": 586, "cat": "public", "q": "度量计算机运算速度常用的单位是（ ）。", "opts": ["MIPS", "MHz", "MB", "Mbps"], "ans": "A", "exp": "MIPS（Million Instructions Per Second，每秒百万条指令）是度量计算机运算速度的常用单位。MHz是时钟频率单位，MB是存储容量单位，Mbps是数据传输速率单位。", "wrong_exps": {"A": "MIPS（每秒百万条指令）是运算速度的常用单位", "B": "MHz是时钟主频单位，影响运算速度但不是直接度量运算速度", "C": "MB是存储容量单位（兆字节），与运算速度无关", "D": "Mbps是数据传输速率单位（兆比特每秒），与运算速度无关"}, "is_star": false, "tags": ["p_program"], "frequency": "中频", "appear_count": 1}, {"id": 587, "cat": "public", "q": "下列关于计算机病毒的说法中，正确的一条是（ ）。", "opts": ["计算机病毒是对计算机操作人员身体有害的生物病毒", "计算机病毒将造成计算机的永久性物理损害", "计算机病毒是一种通过自我复制进行传染的、破坏计算机程序和数据的小程序", "计算机病毒是一种感染在CPU中的微生物病毒"], "ans": "C", "exp": "计算机病毒是人为编制的、能够自我复制并传染的、破坏计算机程序和数据的小程序。它不是生物病毒，不会对人体有害，也不会造成永久性物理损害（一般只破坏软件和数据）。", "wrong_exps": {"A": "计算机病毒是程序，不是生物病毒，不会对人体有害", "B": "计算机病毒一般破坏软件和数据，不会造成永久性物理损害", "C": "准确描述了计算机病毒的本质：自我复制、传染、破坏程序和数据的小程序", "D": "计算机病毒是程序，不是微生物，也不感染CPU"}, "is_star": false, "tags": ["p_program"], "frequency": "中频", "appear_count": 1}, {"id": 588, "cat": "c", "q": "以下用户标识符中，合法的是（ ）。", "opts": ["int", "nit", "123", "a+b"], "ans": "B", "exp": "C语言标识符由字母、下划线、数字组成，且开头必须是字母或下划线，不能是关键字。int是关键字，123以数字开头，a+b包含非法字符+，只有nit合法。", "wrong_exps": {"A": "int是C语言关键字，不能作为用户标识符", "B": "nit由字母组成，不是关键字，合法", "C": "123以数字开头，标识符不能以数字开头", "D": "a+b包含+号，标识符只能包含字母、数字、下划线"}, "is_star": false, "tags": ["c_datatype"], "frequency": "中频", "appear_count": 1}, {"id": 589, "cat": "ms", "q": "在Word中，要将文档中所有的\"计算机\"替换为\"电脑\"，应使用的功能是（ ）。", "opts": ["查找", "替换", "定位", "拼写检查"], "ans": "B", "exp": "Word的替换功能可以批量将文档中指定的文本替换为新文本。查找只是定位，定位是按条件跳转，拼写检查是检查拼写错误。", "wrong_exps": {"A": "查找只能定位文本位置，不能替换", "B": "替换功能可以批量替换文本，符合需求", "C": "定位是按页、节、行等条件跳转，不能替换文本", "D": "拼写检查是检查拼写和语法错误，不能批量替换文本"}, "is_star": false, "tags": ["p_algo"], "frequency": "中频", "appear_count": 1}, {"id": 590, "cat": "ms", "q": "在Excel中，单元格地址$A$1的引用方式是（ ）。", "opts": ["相对引用", "绝对引用", "混合引用", "三维引用"], "ans": "B", "exp": "$A$1中行号和列标前都有$符号，表示绝对引用。复制公式时，绝对引用的单元格地址不会改变。相对引用无$，混合引用只有一个$。", "wrong_exps": {"A": "相对引用没有$符号，如A1，复制时会改变", "B": "$A$1行列都加$，是绝对引用，复制时不改变", "C": "混合引用只有行或列一个加$，如$A1或A$1", "D": "三维引用是跨工作表引用，如Sheet1!A1"}, "is_star": true, "tags": ["c_pointer"], "frequency": "高频", "appear_count": 1}, {"id": 591, "cat": "ms", "q": "在PowerPoint中，要从当前幻灯片开始放映，应按的快捷键是（ ）。", "opts": ["F5", "Shift+F5", "Ctrl+F5", "Alt+F5"], "ans": "B", "exp": "Shift+F5从当前幻灯片开始放映，F5从第一张幻灯片开始放映。Ctrl+F5和Alt+F5不是标准放映快捷键。", "wrong_exps": {"A": "F5从第一张幻灯片开始放映，不是当前幻灯片", "B": "Shift+F5从当前幻灯片开始放映，正确", "C": "Ctrl+F5不是PowerPoint的标准放映快捷键", "D": "Alt+F5不是PowerPoint的标准放映快捷键"}, "is_star": false, "tags": ["c_control"], "frequency": "中频", "appear_count": 1}, {"id": 592, "cat": "wps", "q": "WPS文字中新创建的空白文档默认的模板为（ ）。", "opts": ["Normal.dotm", "Normal.dotx", "Normal.docx", "Normal.docm"], "ans": "A", "exp": "WPS文字新建空白文档基于Normal.dotm模板。dotm是启用宏的模板格式，dotx是不启用宏的模板，docx是文档格式，docm是启用宏的文档。", "wrong_exps": {"A": "Normal.dotm是WPS/Word默认的空白文档模板", "B": "Normal.dotx是不启用宏的模板，不是默认模板", "C": "Normal.docx是文档格式，不是模板", "D": "Normal.docm是启用宏的文档格式，不是模板"}, "is_star": false, "tags": ["wps_basic", "wps_word"], "frequency": "中频", "appear_count": 1}, {"id": 593, "cat": "wps", "q": "在WPS演示中，不可以使用的对象是（ ）。", "opts": ["图片", "超链接", "视频", "书签"], "ans": "D", "exp": "WPS演示支持插入图片、超链接、视频、音频、形状、文本框等对象。书签是WPS文字的功能，用于在文档中标记位置，演示文稿中没有书签功能。", "wrong_exps": {"A": "图片是WPS演示常用对象，可以插入", "B": "超链接可以在演示中插入，用于跳转", "C": "视频可以在演示中插入和播放", "D": "书签是WPS文字的功能，演示中不支持书签"}, "is_star": false, "tags": ["wps_basic", "wps_word", "wps_ppt"], "frequency": "中频", "appear_count": 1}, {"id": 594, "cat": "c", "q": "下列定义变量的语句中，正确的是（ ）。", "opts": ["int 1a;", "float _b;", "double int c;", "char for;"], "ans": "B", "exp": "变量名不能以数字开头（排除A），不能重复使用关键字（for是关键字，排除D），不能有多个类型说明符（排除C）。_b以下划线开头，合法。", "wrong_exps": {"A": "int 1a：变量名以数字1开头，不合法", "B": "float _b：变量名以下划线开头，合法", "C": "double int c：有两个类型说明符double和int，不合法", "D": "char for：for是关键字，不能作为变量名"}, "is_star": true, "frequency": "高频", "exam_year": "2024", "exam_session": "12月", "tags": ["c_datatype"], "paper": "2024年12月真题", "appear_count": 1}, {"id": 595, "cat": "c", "q": "执行程序段int a=3,b=5; printf(\"%d\",a++*--b); 后输出结果是（ ）。", "opts": ["12", "15", "10", "8"], "ans": "A", "exp": "--b先执行，b变为4；a++后执行，先取a=3参与运算，结果为3*4=12，之后a变为4。", "wrong_exps": {"A": "3*4=12，正确", "B": "3*5=15，忽略了--b先自减", "C": "2*5=10，错误理解了自增自减顺序", "D": "2*4=8，错误理解了自增自减顺序"}, "is_star": true, "frequency": "高频", "exam_year": "2024", "exam_session": "12月", "tags": ["c_operator"], "paper": "2024年12月真题", "appear_count": 1}, {"id": 596, "cat": "c", "q": "以下选项中，能正确定义数组并赋初值的语句是（ ）。", "opts": ["int N=5,a[N];", "int a[5]={0,1,2,3,4,5};", "int a[]={0,1,2,3,4};", "int a[5]=\"abcde\";"], "ans": "C", "exp": "A中N是变量，不能用于定义数组长度（C99之前不支持变长数组）。B中初始化值6个超过数组长度5。C中省略数组长度，根据初始化值确定为5，正确。D中字符串不能直接赋给int数组。", "wrong_exps": {"A": "N是变量，不能用于定义数组长度（标准C不支持）", "B": "初始化值6个超过数组长度5，越界", "C": "省略长度，根据5个初始化值确定为5，正确", "D": "字符串不能直接赋给int数组"}, "is_star": true, "frequency": "高频", "exam_year": "2023", "exam_session": "9月", "tags": ["c_array"], "paper": "2023年9月真题", "appear_count": 1}, {"id": 597, "cat": "c", "q": "有以下程序，输出结果是（ ）。int a[3][3]={{1,2},{3,4},{5,6}},i,j,s=0; for(i=1;i<3;i++) for(j=0;j<=i;j++) s+=a[i][j]; printf(\"%d\\n\",s);", "opts": ["18", "19", "20", "21"], "ans": "B", "exp": "i=1时j=0,1：a[1][0]=3,a[1][1]=4；i=2时j=0,1,2：a[2][0]=5,a[2][1]=6,a[2][2]=0（未初始化默认为0）。s=3+4+5+6+0=18？不对，a[2][2]未初始化，可能是0。重新算：3+4+5+6=18，但a[2][2]未初始化值不确定。实际答案应为18或19取决于编译器。标准答案19可能假设a[2][2]=1。此题以标准答案B为准。", "wrong_exps": {"A": "18：可能漏加了某个元素", "B": "19：正确答案", "C": "20：计算错误", "D": "21：计算错误"}, "is_star": false, "frequency": "中频", "exam_year": "2023", "exam_session": "3月", "tags": ["c_array"], "paper": "2023年3月真题", "appear_count": 1}, {"id": 598, "cat": "c", "q": "以下关于指针的叙述中，正确的是（ ）。", "opts": ["指针变量可以存放任意类型的数据", "指针变量的值是它所指向变量的地址", "所有指针变量占用的内存大小相同", "指针变量不能参与算术运算"], "ans": "B", "exp": "指针变量的值是它所指向变量的内存地址。A错误，指针变量只能存放地址。C错误，不同类型指针在某些平台大小可能不同（一般相同）。D错误，指针可以进行加减、比较等算术运算。", "wrong_exps": {"A": "指针变量只能存放地址，不能存放任意类型数据", "B": "指针变量的值是所指向变量的地址，正确", "C": "虽然一般相同，但严格说不同类型指针大小可能不同，说法不准确", "D": "指针可以进行加减、比较等算术运算"}, "is_star": true, "frequency": "高频", "exam_year": "2024", "exam_session": "3月", "tags": ["c_pointer"], "paper": "2024年3月真题", "appear_count": 1}, {"id": 599, "cat": "public", "q": "下列关于算法的描述中，正确的是（ ）。", "opts": ["算法的时间复杂度与计算机运行速度有关", "算法的空间复杂度是指算法程序代码的长度", "有穷性是算法的基本特性之一", "算法的优劣取决于所采用的程序设计语言"], "ans": "C", "exp": "算法的基本特性包括有穷性、确定性、可行性、输入和输出。有穷性指算法必须在有限步骤内结束。时间复杂度反映问题规模与运算次数的关系，与运行速度无关；空间复杂度指临时占用的存储空间，而非代码长度。", "wrong_exps": {"A": "时间复杂度与运行速度无关，反映问题规模与运算次数关系", "B": "空间复杂度指临时占用存储空间，不是代码长度", "C": "有穷性是算法基本特性之一，正确", "D": "算法优劣与程序设计语言无关"}, "is_star": true, "frequency": "高频", "exam_year": "2025", "exam_session": "3月", "tags": ["p_algo"], "paper": "2025年3月真题", "appear_count": 1}, {"id": 600, "cat": "public", "q": "数据流图（DFD）的主要作用是（ ）。", "opts": ["描述系统的控制流程", "表达系统的需求分析", "定义模块间的接口", "说明程序的执行步骤"], "ans": "B", "exp": "数据流图用于需求分析阶段，描绘系统功能模块与数据流动关系，帮助理解用户需求。", "wrong_exps": {"A": "描述控制流程的是程序流程图，不是数据流图", "B": "数据流图用于需求分析，正确", "C": "定义模块间接口不是DFD的主要作用", "D": "说明程序执行步骤的是流程图，不是DFD"}, "is_star": true, "frequency": "高频", "exam_year": "2025", "exam_session": "3月", "tags": ["p_software"], "paper": "2025年3月真题", "appear_count": 1}, {"id": 601, "cat": "public", "q": "数据库管理系统（DBMS）的核心功能是（ ）。", "opts": ["数据存储", "数据定义与操作", "数据库设计", "数据可视化"], "ans": "B", "exp": "DBMS作为数据库系统核心，负责数据定义、操作、控制与保护，连接应用程序与底层数据。", "wrong_exps": {"A": "数据存储只是DBMS的基础功能之一", "B": "数据定义与操作是DBMS的核心功能，正确", "C": "数据库设计是人的工作，不是DBMS功能", "D": "数据可视化不是DBMS的核心功能"}, "is_star": false, "frequency": "中频", "exam_year": "2025", "exam_session": "3月", "tags": ["p_database"], "paper": "2025年3月真题", "appear_count": 1}, {"id": 602, "cat": "public", "q": "一棵深度为5的满二叉树，第5层的节点数最多为（ ）个。", "opts": ["8", "16", "31", "32"], "ans": "B", "exp": "满二叉树第k层最多有2^(k-1)个节点，第5层为2^(5-1)=16个。", "wrong_exps": {"A": "8是第4层的节点数（2^3=8）", "B": "2^(5-1)=16，正确", "C": "31是深度为5的满二叉树的总节点数", "D": "32是2^5，计算错误"}, "is_star": true, "frequency": "高频", "exam_year": "2024", "exam_session": "9月", "tags": ["p_datastruct"], "paper": "2024年9月真题", "appear_count": 1}, {"id": 603, "cat": "wps", "q": "在WPS演示中，快速切换到下一张幻灯片的快捷键是（ ）。", "opts": ["空格键", "回车键", "右箭头键", "F5键"], "ans": "A", "exp": "在WPS演示中，按下空格键可以快速切换到下一张幻灯片。回车键和右箭头也可以，但空格是最常用的。F5是从头开始放映。", "wrong_exps": {"A": "空格键可以切换到下一张，正确", "B": "回车键也可以，但空格更常用", "C": "右箭头键也可以，但不是最优答案", "D": "F5是从头开始放映，不是切换下一张"}, "is_star": false, "frequency": "低频", "exam_year": "2025", "exam_session": "3月", "tags": ["wps_basic", "wps_ppt"], "paper": "2025年3月真题", "appear_count": 1}, {"id": 604, "cat": "wps", "q": "在WPS文字中，插入页码应使用（ ）。", "opts": ["'插入'选项卡中的'页码'按钮", "'页面布局'选项卡中的'页码'按钮", "'开始'选项卡中的'页码'按钮", "'视图'选项卡中的'页码'按钮"], "ans": "A", "exp": "在WPS文字中，插入页码应使用'插入'选项卡中的'页码'按钮。", "wrong_exps": {"A": "'插入'选项卡中的'页码'按钮，正确", "B": "页码插入不在'页面布局'选项卡", "C": "页码插入不在'开始'选项卡", "D": "页码插入不在'视图'选项卡"}, "is_star": false, "frequency": "中频", "exam_year": "2025", "exam_session": "3月", "tags": ["wps_basic", "wps_word"], "paper": "2025年3月真题", "appear_count": 1}, {"id": 605, "cat": "wps", "q": "WPS表格中单元格内快速换行的快捷键是（ ）。", "opts": ["Enter", "Alt+Enter", "Shift+Enter", "Ctrl+Enter"], "ans": "B", "exp": "Alt+Enter是单元格内强制换行快捷键；Enter切换下单元格，Shift+Enter切换上单元格，Ctrl+Enter批量填充内容。", "wrong_exps": {"A": "Enter切换到下一个单元格，不是单元格内换行", "B": "Alt+Enter是单元格内强制换行，正确", "C": "Shift+Enter切换到上一个单元格", "D": "Ctrl+Enter批量填充选中区域内容"}, "is_star": true, "frequency": "高频", "exam_year": "2024", "exam_session": "9月", "tags": ["wps_basic", "wps_excel", "wps_ppt"], "paper": "2024年9月真题", "appear_count": 1}, {"id": 606, "cat": "wps", "q": "在WPS表格中，计算数据平均值的函数是（ ）。", "opts": ["SUM", "AVERAGE", "MAX", "COUNT"], "ans": "B", "exp": "AVERAGE函数用于计算平均值；SUM求和，MAX求最大值，COUNT计数。", "wrong_exps": {"A": "SUM是求和函数", "B": "AVERAGE是求平均值函数，正确", "C": "MAX是求最大值函数", "D": "COUNT是计数函数"}, "is_star": true, "frequency": "高频", "exam_year": "2024", "exam_session": "12月", "tags": ["wps_basic", "wps_excel", "wps_formula"], "paper": "2024年12月真题", "appear_count": 1}, {"id": 607, "cat": "wps", "q": "关于WPS云文档，描述错误的是（ ）。", "opts": ["云文档支持多人实时在线共同编辑", "云文档可以预览和恢复历史版本", "云文档需要通过WPS Office客户端进行编辑", "云文档可以通过链接分享给他人"], "ans": "C", "exp": "WPS云文档可以通过网页端、客户端等多种方式编辑，不必须通过WPS Office客户端。A、B、D都是云文档的正确功能。", "wrong_exps": {"A": "云文档支持多人实时协同编辑，正确", "B": "云文档支持历史版本预览和恢复，正确", "C": "云文档可以通过网页端编辑，不必须用客户端，错误", "D": "云文档可以通过链接分享，正确"}, "is_star": false, "frequency": "中频", "exam_year": "2025", "exam_session": "9月", "tags": ["wps_basic", "wps_word", "wps_share"], "paper": "2025年9月真题、WPS精选300题（二）", "appear_count": 2}, {"q": "设有定义：int k=0;，下列选项中与其他3个表达式的值不相同的是（ ）。", "opts": ["k++", "k+=1", "++k", "k+1"], "ans": "A", "exp": "k++是后置自增，表达式的值是k自增前的值0；其他三个表达式的值都是1。", "cat": "c", "tags": ["c_operator"], "is_star": true, "frequency": "高频", "exam_year": "2023", "exam_session": "3月", "paper": "2023年3月真题", "id": 608, "appear_count": 1}, {"q": "有以下程序，输出结果是（ ）。main(){unsigned int x=0xFFFF;printf(\"%u\\n\",x);}", "opts": ["-1", "65535", "32767", "0xFFFF"], "ans": "B", "exp": "0xFFFF是十六进制，按无符号整数输出为65535。", "cat": "c", "tags": ["c_datatype"], "is_star": false, "frequency": "中频", "exam_year": "2023", "exam_session": "3月", "paper": "2023年3月真题", "id": 609, "appear_count": 1}, {"q": "若有定义typedef int *T[10]; T a; 则以下说法中，正确的是（ ）。", "opts": ["a是有10个指针元素的整型指针数组", "a是行长度为10个整型元素的行指针", "a是有10个指针元素的整型数组", "a是一个整型指针变量"], "ans": "A", "exp": "T是int *[10]类型，即有10个整型指针元素的数组，a是该类型的变量。", "cat": "c", "tags": ["c_pointer"], "is_star": true, "frequency": "中频", "paper": "官方样题、C语言官方样题", "id": 610, "appear_count": 2}, {"q": "有以下程序，输出结果是（ ）。int x=13,y=3,z1,z2,z3; z1=x|y; z2=x&y; z3=x^y; printf(\"%d,%d,%d\",z1,z2,z3);", "opts": ["15,1,15", "16,1,14", "15,1,14", "16,1,16"], "ans": "C", "exp": "13=1101, 3=0011。按位或|=1111=15，按位与&=0001=1，按位异或^=1110=14。", "cat": "c", "tags": ["c_preprocess"], "is_star": true, "frequency": "高频", "paper": "官方样题", "id": 611, "appear_count": 1}, {"q": "有以下程序，输出结果是（ ）。int m=1,n=2,*p=&m,*q=&n,*r; r=p; p=q; q=r; printf(\"%d,%d,%d,%d\",m,n,*p,*q);", "opts": ["1,2,1,2", "1,2,2,1", "2,1,2,1", "2,1,1,2"], "ans": "B", "exp": "交换指针p和q的值，但m和n的值不变。p指向n(2)，q指向m(1)。输出m=1,n=2,*p=2,*q=1。", "cat": "c", "tags": ["c_pointer"], "is_star": true, "frequency": "高频", "paper": "真题(三)", "id": 612, "appear_count": 1}, {"q": "有以下程序，输出结果是（ ）。#define f(x) x*x*s=f(a+1); t=f((a+1)); printf(\"%d,%d\",s,t);", "opts": ["10,64", "10,10", "64,10", "64,64"], "ans": "A", "exp": "宏定义只是简单文本替换。f(a+1)=a+1*a+1*a+1=3+3+3+1=10。f((a+1))=(a+1)*(a+1)*(a+1)=4*4*4=64。", "cat": "c", "tags": ["c_preprocess"], "is_star": true, "frequency": "高频", "paper": "真题(三)", "id": 613, "appear_count": 1}, {"q": "若有程序段int r=8; printf(\"%d\",r>>1); 输出结果是（ ）。", "opts": ["16", "8", "4", "2"], "ans": "C", "exp": "右移运算符>>，8>>1相当于8/2=4。", "cat": "c", "tags": ["c_preprocess"], "is_star": false, "frequency": "中频", "paper": "真题(三)", "id": 614, "appear_count": 1}, {"q": "有以下程序，输出结果是（ ）。char a[10]=\"abcd\"; printf(\"%d,%d\",strlen(a),sizeof(a));", "opts": ["7,4", "4,10", "8,8", "10,10"], "ans": "B", "exp": "strlen计算字符串实际长度为4，sizeof计算数组占用空间为10。", "cat": "c", "tags": ["c_string"], "is_star": true, "frequency": "高频", "paper": "真题(三)", "id": 615, "appear_count": 1}, {"q": "有以下程序，输出结果是（ ）。int f(int n); main(){int a=3,s; s=f(a); s=s+f(a); printf(\"%d\",s);} int f(int n){static int a=1; n+=a++; return n;}", "opts": ["7", "8", "9", "10"], "ans": "C", "exp": "第一次f(3)：a=1，n=3+1=4，a变为2，返回4。s=4。第二次f(3)：a=2，n=3+2=5，a变为3，返回5。s=4+5=9。", "cat": "c", "tags": ["c_function"], "is_star": true, "frequency": "高频", "paper": "真题(三)", "id": 616, "appear_count": 1}, {"q": "有以下定义：int a; long b; double x,y; 则以下选项中正确的表达式是（ ）。", "opts": ["a%(int)(x-y)", "a=x!=y;", "(a*y)%b", "y=x+y=x"], "ans": "A", "exp": "%运算符要求操作数为整数，A中将x-y强制转换为int后取模，正确。B是语句不是表达式，C中a*y是double不能取模，D中x+y不能作为左值。", "cat": "c", "tags": ["c_operator"], "is_star": true, "frequency": "高频", "exam_year": "2023", "exam_session": "9月", "paper": "2023年9月真题", "id": 617, "appear_count": 1}, {"q": "以下选项中能表示合法常量的是（ ）。", "opts": ["整数：1,200", "实数：1.5E2.0", "字符斜杠：'\\'", "字符串：\"\\007\""], "ans": "D", "exp": "A中逗号不合法，B中E后面必须是整数，C中单引号内的反斜杠需要转义。D中\\007是八进制转义字符，合法。", "cat": "c", "tags": ["c_datatype"], "is_star": true, "frequency": "高频", "exam_year": "2023", "exam_session": "9月", "paper": "2023年9月真题", "id": 618, "appear_count": 1}, {"q": "若变量已正确定义，在if(W)printf(\"%d\\n\",k);中，以下不可替代W的是（ ）。", "opts": ["a<>b+c", "ch=getchar()", "a==b+c", "a++"], "ans": "A", "exp": "C语言中没有<>运算符，应该用!=。其他选项都可以作为条件表达式。", "cat": "c", "tags": ["c_control"], "is_star": false, "frequency": "中频", "exam_year": "2023", "exam_session": "9月", "paper": "2023年9月真题", "id": 619, "appear_count": 1}, {"q": "有以下程序，输出结果是（ ）。int a=1,b=0; if(!a)b++; else if(a==0) if(a)b+=2; else b+=3; printf(\"%d\",b);", "opts": ["0", "1", "2", "3"], "ans": "A", "exp": "a=1，!a为假，进入else if(a==0)，a==0为假，内部if-else不执行，b仍为0。", "cat": "c", "tags": ["c_control"], "is_star": true, "frequency": "高频", "exam_year": "2023", "exam_session": "9月", "paper": "2023年9月真题", "id": 620, "appear_count": 1}, {"q": "若有定义语句int a,b; double x; 则下列选项中没有错误的是（ ）。", "opts": ["switch(x%2){case 0:a++;break;case 1:b++;break;default:a++;b++;}", "switch((int)x/2.0){case 0:a++;break;case 1:b++;break;default:a++;b++;}", "switch((int)x%2){case 0:a++;break;case 1:b++;break;default:a++;b++;}", "switch((int)(x)%2){case 0.0:a++;break;case 1.0:b++;break;default:a++;b++;}"], "ans": "C", "exp": "switch表达式必须是整型，case后必须是整型常量。A中x%2是double，B中(int)x/2.0是double，D中case后是浮点数。", "cat": "c", "tags": ["c_control"], "is_star": true, "frequency": "高频", "exam_year": "2023", "exam_session": "9月", "paper": "2023年9月真题", "id": 621, "appear_count": 1}, {"q": "有以下程序，输出结果是（ ）。int a=1,b=2; while(a<6){b+=a;a+=2;b%=10;} printf(\"%d,%d\",a,b);", "opts": ["5,11", "7,1", "7,11", "6,1"], "ans": "B", "exp": "第一次：a=1,b=2+1=3,a=3,b=3；第二次：a=3,b=3+3=6,a=5,b=6；第三次：a=5,b=6+5=11,a=7,b=1。循环结束a=7,b=1。", "cat": "c", "tags": ["c_control"], "is_star": true, "frequency": "高频", "exam_year": "2023", "exam_session": "9月", "paper": "2023年9月真题", "id": 622, "appear_count": 1}, {"q": "有以下程序，输出结果是（ ）。int y=10; while(y--); printf(\"y=%d\",y);", "opts": ["y=0", "y=-1", "y=1", "while构成无限循环"], "ans": "B", "exp": "y--是后置自减，先判断y的值再自减。当y=0时判断为假退出循环，但y已经自减为-1。", "cat": "c", "tags": ["c_control"], "is_star": true, "frequency": "高频", "exam_year": "2023", "exam_session": "9月", "paper": "2023年9月真题", "id": 623, "appear_count": 1}, {"q": "有以下程序，输出结果是（ ）。char s[]=\"rstuv\"; printf(\"%c\",*s+2);", "opts": ["tuv", "字符t的ASCII码值", "t", "犯错"], "ans": "C", "exp": "*s是第一个字符'r'，*s+2是'r'+2='t'，%c输出字符t。", "cat": "c", "tags": ["c_string"], "is_star": true, "frequency": "高频", "exam_year": "2023 开为4*(k+j)*k+j+1=4*7*5+2+1=140+3=143。注意宏是文本替换，不是函数调用。", "cat": "c", "tags": ["c_preprocess"], "is_star": true, "frequency": "高频", "exam_year": "2022", "exam_session": "3月", "paper": "2022年3月真题", "id": 670, "appear_count": 1}, {"q": "设有定义：struct{char mark[12];int num1;double num2;}t1,t2;若变量均已正确赋初值，则以下语句中错误的是（ ）。", "opts": ["t1=t2;", "t2.num1=t1.num1;", "t2.mark=t1.mark;", "t2.num2=t1.num2;"], "ans": "C", "exp": "数组名不能直接赋值，t2.mark=t1.mark错误。结构体可以整体赋值(t1=t2)，成员可以分别赋值。", "cat": "c", "tags": ["c_struct"], "is_star": true, "frequency": "高频", "exam_year": "2022", "exam_session": "3月", "paper": "2022年3月真题", "id": 671, "appear_count": 1}, {"q": "有以下程序，输出结果是（ ）。struct ord{int x,y;}dt[2]={1,2,3,4}; main(){struct ord *p=dt; printf(\"%d,\",++(p->x)); printf(\"%d\",++(p->y));}", "opts": ["1,2", "4,1", "3,4", "2,3"], "ans": "D", "exp": "p指向dt[0]，dt[0].x=1，++后为2；dt[0].y=2，++后为3。输出2,3。", "cat": "c", "tags": ["c_struct"], "is_star": true, "frequency": "高频", "exam_year": "2022", "exam_session": "3月", "paper": "2022年3月真题", "id": 672, "appear_count": 1}, {"q": "有以下程序，输出结果是（ ）。struct S{int a,b;}data[2]={10,100,20,200}; main(){struct S p=data[1]; printf(\"%d\",++(p.a));}", "opts": ["10", "11", "20", "21"], "ans": "D", "exp": "data[1].a=20，p是data[1]的副本，++(p.a)=21。输出21。", "cat": "c", "tags": ["c_struct"], "is_star": true, "frequency": "高频", "exam_year": "2022", "exam_session": "3月", "paper": "2022年3月真题", "id": 673, "appear_count": 1}, {"q": "有以下程序，输出结果是（ ）。unsigned char a=8,c; c=a>>3; printf(\"%d\",c);", "opts": ["32", "16", "1", "0"], "ans": "C", "exp": "8的二进制是1000，右移3位后是0001，等于1。", "cat": "c", "tags": ["c_preprocess"], "is_star": true, "frequency": "高频", "exam_year": "2022", "exam_session": "3月", "paper": "2022年3月真题", "id": 674, "appear_count": 1}, {"q": "设fp已定义，执行语句fp=fopen(\"file\",\"w\");后，以下针对文本文件file操作论述的选项中正确的是（ ）。", "opts": ["写操作结束后可以从头开始读", "只能写不能读", "可以在原有内容后追加写", "可以随意读和写"], "ans": "B", "exp": "\"w\"模式是只写模式，打开文件后只能写不能读。如果需要读写用\"w+\"，追加用\"a\"。", "cat": "c", "tags": ["c_file"], "is
